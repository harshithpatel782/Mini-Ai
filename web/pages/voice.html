
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b14">

  <title>Vision | MINI-AI</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    .vision-container {
      width: min(900px, 92%);
      margin: 50px auto;
    }

    .vision-header {
      margin-bottom: 30px;
    }

    .vision-header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .vision-panel {
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
    }

    .upload-area {
      display: grid;
      place-items: center;
      min-height: 230px;
      padding: 24px;
      border: 2px dashed rgba(255,255,255,0.25);
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
    }

    .upload-area input {
      max-width: 100%;
      margin-top: 18px;
    }

    .image-preview {
      display: none;
      max-width: 100%;
      max-height: 360px;
      margin: 24px auto;
      border-radius: 12px;
    }

    .vision-question {
      width: 100%;
      min-height: 90px;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      resize: vertical;
    }

    .vision-button {
      margin-top: 16px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    .vision-message {
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="brand" href="dashboard.html">
      <span class="brand-mark">M</span>
      <span>MINI-AI</span>
    </a>

    <a href="dashboard.html">Dashboard</a>
  </header>

  <main class="vision-container">

    <section class="vision-header">
      <p class="eyebrow">VISUAL INTELLIGENCE</p>
      <h1>MINI-AI Vision</h1>
      <p>Choose an image and prepare a question about it.</p>
    </section>

    <section class="vision-panel">

      <label class="upload-area" for="vision-image">
        <span>
          <strong>Select an image</strong>
          <br>
          <small>Choose a JPG, PNG or WEBP image from your device.</small>
        </span>

        <input
          type="file"
          id="vision-image"
          accept="image/jpeg,image/png,image/webp"
        >
      </label>

      <img
        id="image-preview"
        class="image-preview"
        alt="Selected image preview"
      >

      <label for="vision-question">What would you like to know?</label>

      <textarea
        id="vision-question"
        class="vision-question"
        placeholder="Describe this image..."
        maxlength="3000"
      ></textarea>

      <button
        type="button"
        id="analyze-image"
        class="vision-button"
        disabled
      >
        Analyze Image
      </button>

      <p
        id="vision-message"
        class="vision-message"
        role="status"
        aria-live="polite"
      >
        Select an image to begin. Image analysis requires a compatible
        local vision model.
      </p>

    </section>

  </main>

  <script>
    const imageInput = document.getElementById("vision-image");
    const preview = document.getElementById("image-preview");
    const analyzeButton = document.getElementById("analyze-image");
    const message = document.getElementById("vision-message");

    let previewUrl = null;

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      if (!file) {
        preview.removeAttribute("src");
        preview.style.display = "none";
        analyzeButton.disabled = true;
        message.textContent = "Select an image to begin.";
        return;
      }

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        imageInput.value = "";
        preview.style.display = "none";
        analyzeButton.disabled = true;
        message.textContent = "Please select a JPG, PNG or WEBP image.";
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        imageInput.value = "";
        preview.style.display = "none";
        analyzeButton.disabled = true;
        message.textContent = "Image must be smaller than 10 MB.";
        return;
      }

      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.style.display = "block";

      analyzeButton.disabled = false;
      message.textContent =
        "Image selected. Connect a local vision model to analyze it.";
    });

    analyzeButton.addEventListener("click", () => {
      message.textContent =
        "Image preview is ready, but the local vision model is not connected yet.";
    });

    window.addEventListener("beforeunload", () => {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
    });
  </script>

</body>
</html>
